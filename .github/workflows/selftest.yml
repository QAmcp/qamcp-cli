# Tests QAmcp itself on GitHub's computers: the tests, the published package, the Action,
# and the Docker image. Runs on every push and pull request.
name: Self test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    # The package promises Node 20 or newer: prove it on every supported line.
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: The package builds, runs, and contains only what it should
        run: |
          npm run build
          node dist/cli.js --help | grep -q "Exit codes"
          npm pack --dry-run 2>&1 | tee pack.txt
          if grep -E " (src|test)/|\.env" pack.txt; then echo "the package contains files it should not"; exit 1; fi

  action-link:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test a public server with the Action
        id: qamcp
        uses: ./
        with:
          url: https://mcp.context7.com/mcp
          fail-under: 60
          save-baseline: qamcp-baseline.json
      - name: The Action's outputs are filled in
        run: |
          echo "score=${{ steps.qamcp.outputs.score }} gate=${{ steps.qamcp.outputs.gate }}"
          test -n "${{ steps.qamcp.outputs.score }}"
          test "${{ steps.qamcp.outputs.gate }}" = "passed"
          test -f qamcp-junit.xml -a -f qamcp-report.md -a -f qamcp-report.json -a -f qamcp-baseline.json
      - name: A second run compares with the baseline and finds the tools unchanged
        id: again
        uses: ./
        with:
          url: https://mcp.context7.com/mcp
          baseline: qamcp-baseline.json
          comment: 'false'
      - run: |
          test "${{ steps.again.outputs.gate }}" = "passed"
          test "${{ steps.again.outputs.tools-changed }}" = "false"

  action-gate-fails:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: An impossible bar must fail the build
        id: bar
        continue-on-error: true
        uses: ./
        with:
          url: https://mcp.context7.com/mcp
          fail-under: 101
          comment: 'false'
      - run: |
          test "${{ steps.bar.outcome }}" = "failure"
          test "${{ steps.bar.outputs.gate }}" = "failed"

  action-stdio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test a program, not a link
        id: s
        uses: ./
        with:
          stdio: npx -y @modelcontextprotocol/server-everything
          comment: 'false'
          timeout: '60'
      - run: test -n "${{ steps.s.outputs.score }}"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t qamcp .
      - name: --help works and runs as a normal user
        run: |
          docker run --rm qamcp --help | grep -q "Exit codes"
          test "$(docker run --rm --entrypoint id qamcp -u)" != "0"
      - name: Test a public server from inside the container
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/work" qamcp https://mcp.context7.com/mcp --fail-under 60 --junit /work/r.xml --json /work/r.json
          test -s out/r.xml -a -s out/r.json
      - name: Exit codes 3 and 2
        run: |
          set +e
          docker run --rm qamcp http://127.0.0.1:59999/mcp --timeout 3; test "$?" = "3" || exit 1
          docker run --rm qamcp --bogus; test "$?" = "2" || exit 1
